<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>README</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-light.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<div class="page-container" style="max-width:850px;margin:0 auto;padding:40px">
  <article id="content" class="markdown-body"></article>
</div>

<script>
  const mdUrl = 'https://raw.githubusercontent.com/tziheng/DDTankAuto/main/README.md';
  const content = document.getElementById('content');
  fetch(mdUrl)
    .then(r => r.ok ? r.text() : Promise.reject(`HTTP ${r.status}`))
    .then(text => {
      const dirty = marked.parse(text);
      const clean = DOMPurify.sanitize(dirty);
      content.innerHTML = clean;
      content.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    })
    .catch(e => content.innerHTML = `<p style="color:red">加载失败：${e.message}</p>`);
</script>
